name: Windows - Tailscale RDP

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Restore Cache di Awal
      - name: Restore User Folders (Desktop & Documents)
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
          key: rdp-workspace-cache-${{ github.run_id }}
          restore-keys: |
            rdp-workspace-cache-

      - name: Downloading & Installing Essentials
        run: cmd /c Downloads.bat

      - name: Configure Desktop Environment
        shell: pwsh
        run: |
          # Sembunyikan ikon desktop
          $explorerKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"
          Set-ItemProperty -Path $explorerKey -Name "HideIcons" -Value 1

          # Aktifkan auto-hide taskbar
          $stuckPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\StuckRects3"
          if (Test-Path $stuckPath) {
              $val = (Get-ItemProperty -Path $stuckPath).Settings
              $val[8] = 3
              Set-ItemProperty -Path $stuckPath -Name "Settings" -Value $val
          }

          # Muat ulang Explorer
          Stop-Process -Name explorer -Force
          Start-Sleep -Seconds 2
          Start-Process explorer.exe

      - name: Install & Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Unduh & Install Tailscale (mekanisme resmi, reuse PRD Fase 3/6)
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe"
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait

          # Jalankan Service & Login (tanpa mencetak auth key ke log)
          # Hostname unik per-run agar run paralel tidak saling take-over nama
          # di tailnet (PRD: reuse mekanisme resmi Tailscale).
          $env:Path += ";C:\Program Files\Tailscale"
          tailscale up --authkey=$env:TAILSCALE_AUTHKEY --hostname="github-runner-vm-${{ github.run_id }}"

          Write-Output "Tailscale berhasil terhubung!"
          tailscale ip -4

      - name: Setup Windows RDP (Tailscale-only)
        shell: pwsh
        run: |
          # Workflow baru: native Windows RDP + firewall Tailscale-only.
          # RDP TIDAK diekspos ke public IP / Internet (PRD Fase 4-5).
          .\Enable-RdpHost.ps1
          if ($LASTEXITCODE -ne 0) { throw "Enable-RdpHost.ps1 gagal (exit $LASTEXITCODE)" }
          .\Set-RdpFirewallTailscale.ps1
          if ($LASTEXITCODE -ne 0) { throw "Set-RdpFirewallTailscale.ps1 gagal (exit $LASTEXITCODE)" }

      - name: Show Tailscale IP (Windows App endpoint)
        shell: pwsh
        run: |
          .\Get-TailscaleIp.ps1
          if ($LASTEXITCODE -ne 0) { throw "Get-TailscaleIp.ps1 gagal (exit $LASTEXITCODE)" }

      - name: Keep Alive Loop
        shell: pwsh
        run: |
          Write-Output "Runner aktif. Terhubung via Tailscale + Windows RDP (gunakan Windows App ke Tailscale IP di atas)..."
          while ($true) {
              Start-Sleep -Seconds 60
          }

      # 2. Save Cache di Akhir (Pasti Jalan Meskipun Di-Cancel)
      - name: Save User Folders (Desktop & Documents)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            C:\Users\runneradmin\Desktop
            C:\Users\runneradmin\Documents
          key: rdp-workspace-cache-${{ github.run_id }}
