name: macOS AnyDesk Test

on:
  workflow_dispatch:

jobs:
  anydesk:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:

      - name: System
        run: |
          echo "=== SYSTEM ==="
          sw_vers
          uname -a
          echo "User: $(whoami)"
          echo "UID: $(id -u)"
          echo "Runner: $RUNNER_NAME"

      - name: GUI Session
        run: |
          echo "=== GUI SESSION ==="

          echo "--- Console User ---"
          stat -f "%Su" /dev/console

          echo
          echo "--- Login Window ---"
          pgrep -fl loginwindow || true

          echo
          echo "--- WindowServer ---"
          pgrep -fl WindowServer || true

          echo
          echo "--- Aqua Session ---"
          launchctl print gui/$(id -u) 2>/dev/null | head -50 || true

      - name: Display
        run: |
          echo "=== DISPLAY ==="

          echo "--- system_profiler ---"
          system_profiler SPDisplaysDataType || true

          echo
          echo "--- Display Details ---"
          system_profiler SPDisplaysDataType 2>/dev/null \
            | grep -E "Chipset|Resolution|UI Looks|Main Display|Display Type|Online" \
            || true

      - name: TCC Screen Capture
        run: |
          echo "=== TCC SCREEN CAPTURE ==="

          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          if [ -f "$DB" ]; then
            echo "TCC database exists"

            sqlite3 "$DB" \
              "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceScreenCapture';" \
              2>&1 || true
          else
            echo "TCC database not found"
          fi

      - name: TCC Accessibility
        run: |
          echo "=== TCC ACCESSIBILITY ==="

          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          if [ -f "$DB" ]; then
            sqlite3 "$DB" \
              "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceAccessibility';" \
              2>&1 || true
          else
            echo "TCC database not found"
          fi

      - name: Screen Capture Test
        run: |
          echo "=== SCREEN CAPTURE TEST ==="

          mkdir -p "$RUNNER_TEMP/capture"

          screencapture \
            -x \
            "$RUNNER_TEMP/capture/desktop-test.png" \
            2>&1 || true

          if [ -f "$RUNNER_TEMP/capture/desktop-test.png" ]; then
            echo "SUCCESS: screenshot created"
            file "$RUNNER_TEMP/capture/desktop-test.png"
            ls -lh "$RUNNER_TEMP/capture/desktop-test.png"
          else
            echo "FAILED: screenshot was not created"
          fi

      - name: GUI Window Test
        run: |
          echo "=== GUI WINDOW TEST ==="

          open -a TextEdit

          sleep 3

          screencapture \
            -x \
            "$RUNNER_TEMP/capture/window-test.png" \
            2>&1 || true

          if [ -f "$RUNNER_TEMP/capture/window-test.png" ]; then
            echo "SUCCESS: GUI window screenshot created"
            file "$RUNNER_TEMP/capture/window-test.png"
            ls -lh "$RUNNER_TEMP/capture/window-test.png"
          else
            echo "FAILED: GUI window screenshot was not created"
          fi

      - name: Install AnyDesk
        run: |
          echo "=== INSTALL ANYDESK ==="

          brew update

          brew install --cask anydesk

          echo
          echo "--- AnyDesk App ---"
          ls -la "/Applications/AnyDesk.app" || true

          echo
          echo "--- AnyDesk Binary ---"
          ls -la "/Applications/AnyDesk.app/Contents/MacOS/AnyDesk" || true

      - name: Launch AnyDesk
        run: |
          echo "=== LAUNCH ANYDESK ==="

          open "/Applications/AnyDesk.app"

          echo "Waiting for AnyDesk..."
          sleep 8

          echo
          echo "--- AnyDesk Processes ---"
          pgrep -fl AnyDesk || true

      - name: Configure AnyDesk Password
        env:
          ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD }}
        run: |
          echo "=== CONFIGURE ANYDESK PASSWORD ==="

          if [ -n "$ANYDESK_PASSWORD" ]; then
            echo "$ANYDESK_PASSWORD" | sudo \
              "/Applications/AnyDesk.app/Contents/MacOS/AnyDesk" \
              --set-password \
              2>&1 || true

            echo "Password command executed."
          else
            echo "ANYDESK_PASSWORD secret is not configured."
            echo "Skipping password configuration."
          fi

      - name: AnyDesk Status
        run: |
          echo "=== ANYDESK STATUS ==="

          APP="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "--- Version ---"
          "$APP" --version 2>&1 || true

          echo
          echo "--- ID ---"
          "$APP" --get-id 2>&1 || true

          echo
          echo "--- Alias ---"
          "$APP" --get-alias 2>&1 || true

          echo
          echo "--- Status ---"
          "$APP" --get-status 2>&1 || true

          echo
          echo "--- Processes ---"
          pgrep -fl AnyDesk || true

      - name: AnyDesk TCC Diagnostic
        run: |
          echo "=== ANYDESK TCC DIAGNOSTIC ==="

          APP="/Applications/AnyDesk.app"
          BUNDLE="com.philandro.anydesk"
          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          echo "--- Bundle Information ---"
          codesign -dvv "$APP" 2>&1 \
            | grep -E "Identifier|TeamIdentifier|Authority" \
            || true

          echo
          echo "--- Screen Recording ---"

          sqlite3 "$DB" \
            "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceScreenCapture' AND client='$BUNDLE';" \
            2>&1 || true

          echo
          echo "--- Accessibility ---"

          sqlite3 "$DB" \
            "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceAccessibility' AND client='$BUNDLE';" \
            2>&1 || true

          echo
          echo "--- All AnyDesk TCC Entries ---"

          sqlite3 "$DB" \
            "SELECT service,client,auth_value,auth_reason FROM access WHERE client='$BUNDLE';" \
            2>&1 || true

      - name: AnyDesk Logs
        run: |
          echo "=== ANYDESK LOGS ==="

          echo "--- Possible Log Locations ---"

          find "$HOME/Library" \
            -iname "*AnyDesk*" \
            -o -iname "*anydesk*" \
            2>/dev/null \
            | head -100 \
            || true

          echo
          echo "--- AnyDesk Processes ---"
          pgrep -fl AnyDesk || true

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-screenshots
          path: |
            ${{ runner.temp }}/capture/desktop-test.png
            ${{ runner.temp }}/capture/window-test.png
          if-no-files-found: warn

      - name: Keep Alive
        run: |
          echo "=== KEEP ALIVE ==="
          echo
          echo "AnyDesk should remain running."
          echo "Runner will stay alive for 5 minutes."
          echo

          for i in {1..30}; do
            echo "[$i/30] $(date)"

            echo "--- AnyDesk ---"
            pgrep -fl AnyDesk || true

            sleep 10
          done
