name: macOS AnyDesk

on:
  workflow_dispatch:

jobs:
  macos-anydesk:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check macOS environment
        run: |
          set -e

          echo "========================================"
          echo "        MACOS ENVIRONMENT"
          echo "========================================"

          echo
          echo "[macOS]"
          sw_vers

          echo
          echo "[Architecture]"
          uname -m

          echo
          echo "[User]"
          whoami

          echo
          echo "[Homebrew]"
          brew --version | head -1 || true

      - name: Check AnyDesk availability
        run: |
          set -e

          echo "========================================"
          echo "        ANYDESK AVAILABILITY"
          echo "========================================"

          brew search --cask anydesk

      - name: Install AnyDesk
        run: |
          set -e

          echo "========================================"
          echo "        INSTALLING ANYDESK"
          echo "========================================"

          brew install --cask anydesk

          echo
          echo "[AnyDesk app]"
          ls -ld /Applications/AnyDesk.app

          echo
          echo "[AnyDesk executable]"
          ls -l /Applications/AnyDesk.app/Contents/MacOS/AnyDesk

      - name: Start AnyDesk
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "========================================"
          echo "          STARTING ANYDESK"
          echo "========================================"

          if [ ! -x "$ANYDESK" ]; then
            echo "[ERROR] AnyDesk executable not found."
            exit 1
          fi

          echo "[INFO] Starting AnyDesk directly..."

          "$ANYDESK" >/tmp/anydesk.log 2>&1 &

          ANYDESK_PID=$!

          echo "[INFO] AnyDesk PID: $ANYDESK_PID"

          echo
          echo "[INFO] Waiting for AnyDesk..."
          sleep 10

          echo
          echo "=== AnyDesk processes ==="
          ps aux | grep -i '[A]nyDesk' || true

          echo
          echo "=== AnyDesk log ==="
          cat /tmp/anydesk.log || true

      - name: Check AnyDesk permissions
        run: |
          echo "========================================"
          echo "        ANYDESK PERMISSIONS"
          echo "========================================"

          echo
          echo "[AnyDesk process]"
          ps aux | grep -i '[A]nyDesk' || true

          echo
          echo "[TCC database]"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "SELECT service, client, auth_value FROM access WHERE client LIKE '%AnyDesk%';" \
            2>&1 || true

          echo
          echo "[Screen capture processes]"
          pgrep -lf 'AnyDesk|WindowServer|loginwindow' || true

      - name: Get AnyDesk information
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "========================================"
          echo "         ANYDESK INFORMATION"
          echo "========================================"

          echo
          echo "[VERSION]"
          "$ANYDESK" --version || true

          echo
          echo "[STATUS]"
          "$ANYDESK" --get-status || true

          echo
          echo "[ID]"
          
          ID=""

          for i in {1..12}; do
            ID="$("$ANYDESK" --get-id 2>/dev/null | tr -d '[:space:]' || true)"

            if [ -n "$ID" ]; then
              break
            fi

            echo "[INFO] AnyDesk ID not ready. Retry $i/12..."
            sleep 5
          done

          if [ -z "$ID" ]; then
            echo "[ERROR] Failed to obtain AnyDesk ID."
            echo
            echo "=== AnyDesk log ==="
            cat /tmp/anydesk.log || true
            exit 1
          fi

          echo
          echo "========================================"
          echo "        ANYDESK CONNECTION"
          echo "========================================"
          echo "AnyDesk ID: $ID"
          echo "========================================"

          echo "ANYDESK_ID=$ID" >> "$GITHUB_ENV"

      - name: Check macOS GUI environment
        run: |
          echo "========================================"
          echo "          GUI ENVIRONMENT"
          echo "========================================"

          echo
          echo "[Console user]"
          stat -f '%Su' /dev/console || true

          echo
          echo "[WindowServer]"
          pgrep -lf WindowServer || true

          echo
          echo "[Display information]"
          system_profiler SPDisplaysDataType || true

          echo
          echo "[AnyDesk processes]"
          ps aux | grep -i '[A]nyDesk' || true

      - name: Keep runner alive
        run: |
          echo "========================================"
          echo "         ANYDESK IS RUNNING"
          echo "========================================"

          echo
          echo "AnyDesk ID: $ANYDESK_ID"

          echo
          echo "The runner will remain active."
          echo "Cancel this workflow manually when finished."

          echo "========================================"

          while true; do
            sleep 60
          done
