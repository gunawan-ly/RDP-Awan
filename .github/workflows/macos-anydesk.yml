name: macOS GUI Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: System
        run: |
          echo "=== SYSTEM ==="
          sw_vers
          uname -a
          echo "User: $(whoami)"
          echo "UID: $(id -u)"

      - name: GUI Session
        run: |
          echo "=== GUI SESSION ==="
          echo "Console user:"
          stat -f "%Su" /dev/console

          echo
          echo "Login window:"
          pgrep -fl loginwindow || true

          echo
          echo "WindowServer:"
          pgrep -fl WindowServer || true

          echo
          echo "Aqua sessions:"
          launchctl print gui/$(id -u) 2>/dev/null | head -30 || true

      - name: Display
        run: |
          echo "=== DISPLAY ==="

          echo "--- system_profiler ---"
          system_profiler SPDisplaysDataType || true

          echo
          echo "--- displays ---"
          system_profiler SPDisplaysDataType 2>/dev/null | grep -E "Chipset|Resolution|UI Looks|Main Display|Display Type|Online" || true

      - name: TCC Screen Capture
        run: |
          echo "=== TCC SCREEN CAPTURE ==="

          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          if [ -f "$DB" ]; then
            echo "TCC database exists"

            sqlite3 "$DB" \
              "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceScreenCapture';" \
              2>&1 || true
          else
            echo "TCC database not found"
          fi

      - name: TCC Accessibility
        run: |
          echo "=== TCC ACCESSIBILITY ==="

          DB="$HOME/Library/Application Support/com.apple.TCC/TCC.db"

          if [ -f "$DB" ]; then
            sqlite3 "$DB" \
              "SELECT service,client,auth_value,auth_reason FROM access WHERE service='kTCCServiceAccessibility';" \
              2>&1 || true
          else
            echo "TCC database not found"
          fi

      - name: Screen Capture Test
        run: |
          echo "=== SCREEN CAPTURE TEST ==="

          mkdir -p "$RUNNER_TEMP/capture"

          echo "Trying screencapture..."

          screencapture \
            -x \
            "$RUNNER_TEMP/capture/test.png" \
            2>&1 || true

          if [ -f "$RUNNER_TEMP/capture/test.png" ]; then
            echo "SUCCESS: screenshot created"
            file "$RUNNER_TEMP/capture/test.png"
            ls -lh "$RUNNER_TEMP/capture/test.png"
          else
            echo "FAILED: screenshot was not created"
          fi

      - name: Process Environment
        run: |
          echo "=== PROCESS ENVIRONMENT ==="
          echo "DISPLAY=$DISPLAY"
          echo "HOME=$HOME"
          echo "USER=$USER"
          echo "SHELL=$SHELL"

      - name: Keep Alive
        run: |
          echo "=== KEEP ALIVE ==="
          echo "Runner will stay alive for 5 minutes."
          sleep 300
