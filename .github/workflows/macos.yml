name: macOS AnyDesk

on:
  workflow_dispatch:

jobs:
  macos-anydesk:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check macOS environment
        run: |
          echo "=== macOS ==="
          sw_vers

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== User ==="
          whoami

          echo
          echo "=== Hardware ==="
          system_profiler SPHardwareDataType | head -20

      - name: Check AnyDesk availability
        run: |
          brew search --cask anydesk

      - name: Keep runner alive
        run: |
          echo "========================================"
          echo "AnyDesk is running."
          echo
          echo "AnyDesk ID: $ANYDESK_ID"
          echo
          echo "Keep-alive started."
          echo "Cancel this workflow manually when finished."
          echo "========================================"

          while true; do
            sleep 60
          done
