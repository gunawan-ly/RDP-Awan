name: MacOs Awan

on:
  workflow_dispatch:

jobs:
  macos-anydesk:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check macOS environment
        run: |
          set -e

          echo "=== macOS ==="
          sw_vers

          echo
          echo "=== Architecture ==="
          uname -m

          echo
          echo "=== User ==="
          whoami

          echo
          echo "=== Homebrew ==="
          brew --version | head -1

      - name: Check AnyDesk availability
        run: |
          set -e

          echo "[INFO] Searching Homebrew cask..."

          brew search --cask anydesk

      - name: Install AnyDesk
        run: |
          set -e

          echo "[INFO] Installing AnyDesk..."

          brew install --cask anydesk

          echo
          echo "[INFO] AnyDesk installation:"
          ls -ld /Applications/AnyDesk.app

          echo
          echo "[INFO] AnyDesk executable:"
          ls -l /Applications/AnyDesk.app/Contents/MacOS/AnyDesk

            - name: Start AnyDesk
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          echo "[INFO] Starting AnyDesk directly..."
          "$ANYDESK" >/tmp/anydesk.log 2>&1 &

          ANYDESK_PID=$!
          echo "[INFO] AnyDesk PID: $ANYDESK_PID"

          echo "[INFO] Waiting for AnyDesk..."
          sleep 10

          echo
          echo "=== AnyDesk processes ==="
          ps aux | grep -i '[A]nyDesk' || true

          echo
          echo "=== AnyDesk log ==="
          cat /tmp/anydesk.log || true

      - name: Get AnyDesk information
        run: |
          set -e

          ANYDESK="/Applications/AnyDesk.app/Contents/MacOS/AnyDesk"

          if [ ! -x "$ANYDESK" ]; then
            echo "[ERROR] AnyDesk executable not found."
            exit 1
          fi

          echo "========================================"
          echo "           ANYDESK INFORMATION"
          echo "========================================"

          echo
          echo "[VERSION]"
          "$ANYDESK" --version || true

          echo
          echo "[STATUS]"
          "$ANYDESK" --get-status || true

          echo
          echo "[ID]"

          ID=""

          for i in {1..12}; do
            ID="$("$ANYDESK" --get-id 2>/dev/null | tr -d '[:space:]' || true)"

            if [ -n "$ID" ]; then
              break
            fi

            echo "[INFO] AnyDesk ID not ready. Retry $i/12..."
            sleep 5
          done

          if [ -z "$ID" ]; then
            echo "[ERROR] Failed to obtain AnyDesk ID."
            exit 1
          fi

          echo
          echo "========================================"
          echo "          ANYDESK CONNECTION"
          echo "========================================"
          echo "AnyDesk ID: $ID"
          echo "========================================"

          echo "ANYDESK_ID=$ID" >> "$GITHUB_ENV"

      - name: Check macOS GUI environment
        run: |
          echo "========================================"
          echo "          GUI ENVIRONMENT"
          echo "========================================"

          echo
          echo "[Console user]"
          stat -f '%Su' /dev/console || true

          echo
          echo "[WindowServer]"
          pgrep -lf WindowServer || true

          echo
          echo "[Display information]"
          system_profiler SPDisplaysDataType || true

          echo
          echo "[AnyDesk processes]"
          ps aux | grep -i '[A]nyDesk' || true

      - name: Keep runner alive
        run: |
          echo "========================================"
          echo "         ANYDESK IS RUNNING"
          echo "========================================"
          echo
          echo "AnyDesk ID: $ANYDESK_ID"
          echo
          echo "The runner will remain active."
          echo "Cancel this workflow manually when finished."
          echo "========================================"

          while true; do
            sleep 60
          done
